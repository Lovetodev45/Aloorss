<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ÆON — Organisme Cosmique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --know:#9cc3ff; --energy:#ffb454; --culture:#f5c87a; --pop:#bcd4ff;
    --ink:#e6e8f2; --dim:#8a8aa8; --panel:rgba(13,13,26,.8); --line:rgba(150,150,200,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#03030a;
    font-family:'Space Grotesk',ui-monospace,monospace;color:var(--ink);
    -webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;display:block;touch-action:none}

  /* ---- En haut à gauche : âge + progression ---- */
  #ageBox{position:fixed;top:16px;left:16px;z-index:12;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:12px 16px;backdrop-filter:blur(12px);
    min-width:220px;max-width:46vw}
  #ageName{font-family:'Orbitron',sans-serif;font-weight:800;font-size:15px;letter-spacing:.16em;
    color:#fff;text-transform:uppercase}
  #ageTag{color:var(--dim);font-size:11px;margin-top:2px;letter-spacing:.04em}
  #ageBar{height:5px;margin-top:9px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
  #ageBar>i{display:block;height:100%;width:0;border-radius:5px;
    background:linear-gradient(90deg,#3a4cff,#f5c542);transition:width .4s ease}
  #ageNext{color:var(--dim);font-size:10px;margin-top:5px;letter-spacing:.08em;font-variant-numeric:tabular-nums}

  /* ---- En haut centre/droite : 4 stats ---- */
  #stats{position:fixed;top:16px;right:16px;z-index:12;display:flex;gap:8px;flex-wrap:wrap;
    justify-content:flex-end;max-width:60vw}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;
    backdrop-filter:blur(12px);min-width:96px}
  .stat .lab{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
  .stat .val{font-family:'Orbitron',sans-serif;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;margin-top:1px}
  .stat .rate{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
  .stat.know .val{color:var(--know)} .stat.energy .val{color:var(--energy)}
  .stat.culture .val{color:var(--culture)} .stat.pop .val{color:var(--pop)}

  /* ---- En bas centre : construction ---- */
  #build{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:12;
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:94vw}
  .bcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;
    backdrop-filter:blur(12px);cursor:pointer;min-width:150px;transition:transform .12s,border-color .2s,background .2s;
    text-align:left}
  .bcard:hover{transform:translateY(-3px);border-color:rgba(169,155,255,.6);background:rgba(22,22,44,.85)}
  .bcard:active{transform:scale(.97)}
  .bcard.no{opacity:.55;cursor:not-allowed}
  .bcard .bn{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:10px}
  .bcard .bn b{color:var(--know);font-family:'Orbitron',sans-serif;font-weight:600}
  .bcard .be{font-size:10.5px;color:var(--dim);margin-top:3px}
  .bcard .bc{font-size:11px;margin-top:5px;font-variant-numeric:tabular-nums}
  .bc.ok{color:#7ee0a0} .bc.ko{color:#e08a8a}

  /* ---- En bas droite : combo ---- */
  #combo{position:fixed;right:18px;bottom:120px;z-index:12;
    font-family:'Orbitron',sans-serif;font-weight:800;font-size:22px;letter-spacing:.04em;
    color:#f5c542;text-shadow:0 0 18px rgba(245,197,66,.5);opacity:0;transform:scale(.7);
    transition:opacity .15s,transform .15s;pointer-events:none}
  #combo.on{opacity:1;transform:scale(1)}

  /* ---- Indice + message central ---- */
  #hint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:11;
    color:var(--dim);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    text-shadow:0 0 14px #000;animation:hp 3s ease-in-out infinite;pointer-events:none}
  @keyframes hp{0%,100%{opacity:.4}50%{opacity:.9}}
  #msg{position:fixed;inset:0;z-index:14;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity .6s ease}
  #msg.show{opacity:1}
  #msg .inner{text-align:center}
  #msg .big{font-family:'Orbitron',sans-serif;font-weight:800;font-size:clamp(28px,6vw,56px);
    letter-spacing:.14em;color:#fff;text-shadow:0 0 40px rgba(169,155,255,.6)}
  #msg .small{margin-top:10px;color:var(--dim);font-size:13px;letter-spacing:.3em;text-transform:uppercase}
  #flash{position:fixed;inset:0;z-index:13;pointer-events:none;background:#fff;opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ageBox">
  <div id="ageName">Âge de Pierre</div>
  <div id="ageTag">La première étincelle.</div>
  <div id="ageBar"><i></i></div>
  <div id="ageNext">— vers le Moyen Âge —</div>
</div>

<div id="stats">
  <div class="stat know"><div class="lab">🧠 Connaissance</div><div class="val" id="s-know">0</div><div class="rate" id="r-know">+0/s</div></div>
  <div class="stat energy"><div class="lab">⚡ Énergie</div><div class="val" id="s-energy">0</div><div class="rate" id="r-energy">+0/s</div></div>
  <div class="stat culture"><div class="lab">✨ Culture</div><div class="val" id="s-culture">0</div><div class="rate" id="r-culture">+0/s</div></div>
  <div class="stat pop"><div class="lab">👥 Population</div><div class="val" id="s-pop">0</div><div class="rate" id="r-pop">+0/s</div></div>
</div>

<div id="build"></div>
<div id="combo"></div>
<div id="hint">Touchez l'organisme pour l'éveiller</div>
<div id="msg"><div class="inner"><div class="big" id="msgBig"></div><div class="small" id="msgSmall"></div></div></div>
<div id="flash"></div>

<script src="vendor/three.min.js"></script>
<script>
"use strict";
(function(){
if(typeof THREE==="undefined"){ document.body.insertAdjacentHTML("beforeend","<p style='position:fixed;top:50%;left:0;right:0;text-align:center'>⚠ Three.js introuvable.</p>"); return; }

// ============================================================
//  ÉTAT DU JEU (en mémoire uniquement)
// ============================================================
const gameState = {
  res:{ know:0, energy:10, culture:0, pop:1 },
  base:{ know:0.1, energy:0.1, culture:0.05, pop:0.01 },
  buildings:{ feu:0, champ:0, ecole:0 },
  totalKnow:0,            // cumul (jamais décroissant) pour les seuils d'âge
  age:0,
  combo:0, lastClick:0,
};
const BUILDINGS=[
  {id:"feu",   name:"Feu de camp",    icon:"🔥", baseCost:10,  rate:0.2, desc:"Autour des flammes naissent les idées."},
  {id:"champ", name:"Champ cultivé",  icon:"🌾", baseCost:50,  rate:1,   desc:"L'agriculture libère du temps pour penser."},
  {id:"ecole", name:"École",          icon:"📜", baseCost:200, rate:6,   desc:"Le savoir se transmet et s'accumule."},
];
const AGES=[
  {name:"Âge de Pierre", tag:"La première étincelle.",            req:0,
   base:0x241410, b2:0x4a2418, rim:0x7a3a22, vein:0x9cc3ff, msg:["ÆON","Une conscience s'éveille"]},
  {name:"Moyen Âge",     tag:"Royaumes, foi et savoir préservé.", req:1000,
   base:0x0a1024, b2:0x1a2444, rim:0xc9a44a, vein:0xbcd0ff, msg:["Moyen Âge","Le savoir survit dans l'ombre"]},
  {name:"Renaissance",   tag:"L'esprit s'ouvre à la lumière.",    req:600000,
   base:0x201a22, b2:0x4a4038, rim:0xffe8c0, vein:0xeaf2ff, msg:["Renaissance","La lumière de l'esprit"]},
];
function costOf(b){ return Math.ceil(b.baseCost * Math.pow(1.15, gameState.buildings[b.id])); }
function knowRate(){ let r=gameState.base.know; for(const b of BUILDINGS) r+=gameState.buildings[b.id]*b.rate; return r; }
function rateOf(k){ return k==="know"? knowRate() : gameState.base[k]; }
function totalBuildings(){ return gameState.buildings.feu+gameState.buildings.champ+gameState.buildings.ecole; }

// ============================================================
//  SCÈNE 3D
// ============================================================
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight,false);
renderer.setClearColor(0x03030a,1);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,1000);

// Éclairage (spec) : ambiant faible + directionnelle dorée + hémisphère cosmique
scene.add(new THREE.AmbientLight(0x0a0a1a,1.0));
const goldLight=new THREE.DirectionalLight(0xffd9a0,1.3); goldLight.position.set(5,4,6); scene.add(goldLight);
scene.add(new THREE.HemisphereLight(0x2a3cff,0x140820,0.5));

// Étoiles cosmiques
(function(){
  const N=1300,p=new Float32Array(N*3),col=new Float32Array(N*3);
  for(let i=0;i<N;i++){const r=70+Math.random()*220,u=Math.random()*2-1,t=Math.random()*6.283,s=Math.sqrt(1-u*u);
    p[i*3]=Math.cos(t)*s*r;p[i*3+1]=u*r;p[i*3+2]=Math.sin(t)*s*r;
    const b=0.45+Math.random()*0.55;col[i*3]=b*0.7;col[i*3+1]=b*0.78;col[i*3+2]=b;}
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(p,3));
  g.setAttribute("color",new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:0.5,vertexColors:true,transparent:true,opacity:.8,sizeAttenuation:true})));
})();

// ---- groupe organisme (tout tourne ensemble) ----
const organism=new THREE.Group();
scene.add(organism);

// ============================================================
//  SHADER — surface noire organique + onde de clic + énergie interne
// ============================================================
const SNOISE=`
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
  i=mod(i,289.0);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=1.0/7.0;vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){float a=0.5,s=0.0;for(int i=0;i<4;i++){s+=a*snoise(p);p*=2.0;a*=0.5;}return s;}
`;
const uni={
  uTime:{value:0}, uEnergy:{value:0},
  uClickPos:{value:new THREE.Vector3(0,1,0)}, uClickAge:{value:99}, uClickStr:{value:0},
  uBase:{value:new THREE.Color(AGES[0].base)}, uB2:{value:new THREE.Color(AGES[0].b2)},
  uRim:{value:new THREE.Color(AGES[0].rim)},
};
const surfMat=new THREE.ShaderMaterial({
  uniforms:uni,
  vertexShader:`
    varying vec3 vLocal; varying vec3 vN; varying vec3 vView;
    void main(){
      vLocal=position;
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      vView=mv.xyz; vN=normalize(normalMatrix*normal);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:SNOISE+`
    precision highp float;
    varying vec3 vLocal; varying vec3 vN; varying vec3 vView;
    uniform float uTime,uEnergy,uClickAge,uClickStr;
    uniform vec3 uClickPos,uBase,uB2,uRim;
    void main(){
      vec3 N=normalize(vN); vec3 V=normalize(-vView);
      float fres=pow(1.0-max(dot(N,V),0.0),3.0);
      vec3 dir=normalize(vLocal);

      // surface noire organique
      float n=fbm(vLocal*1.8+vec3(0.0,0.0,uTime*0.035));
      vec3 base=mix(uBase,uB2,n*0.5+0.5);
      float dif=max(dot(N,normalize(vec3(0.6,0.55,0.7))),0.0);
      vec3 col=base*(0.18+dif*0.55);

      // ÉNERGIE : pulsation interne orange profond (subtile)
      float veins=pow(max(fbm(vLocal*2.4+vec3(7.0)),0.0),2.0);
      float beat=0.5+0.5*sin(uTime*2.0+fbm(vLocal*2.0)*6.28);
      col+=vec3(0.9,0.45,0.12)*veins*beat*uEnergy*0.9;

      // rim cosmique (teinté par l'âge)
      col+=uRim*fres*0.4;
      col+=vec3(0.2,0.26,0.7)*fres*0.25;

      // onde de clic (géodésique, collée à la surface)
      float ang=acos(clamp(dot(dir,normalize(uClickPos)),-1.0,1.0));
      float radius=uClickAge*2.2;
      float band=smoothstep(0.30,0.0,abs(ang-radius));
      float fade=exp(-uClickAge*1.7);
      col+=vec3(0.55,0.72,1.0)*band*fade*(0.9+uClickStr*0.06);

      gl_FragColor=vec4(col,1.0);
    }`,
});
const sphere=new THREE.Mesh(new THREE.SphereGeometry(2,128,128),surfMat);
organism.add(sphere);

// ============================================================
//  CONNAISSANCE — réseau de veines (TubeGeometry) bleu-blanc froid
// ============================================================
const MAXVEINS=46;
const veins=[];
function randDir(){ const u=Math.random()*2-1,t=Math.random()*6.283,s=Math.sqrt(1-u*u);
  return new THREE.Vector3(Math.cos(t)*s,u,Math.sin(t)*s); }
function makeVein(){
  // marche aléatoire sur la sphère → courbe organique ramifiée
  let p=randDir(); let tangent=randDir().cross(p).normalize();
  const pts=[p.clone().multiplyScalar(2.012)];
  const steps=14+Math.floor(Math.random()*10);
  for(let i=0;i<steps;i++){
    // tourne légèrement la tangente
    const axis=p.clone();
    tangent.applyAxisAngle(axis,(Math.random()-0.5)*0.8);
    p.addScaledVector(tangent,0.16).normalize();
    tangent=tangent.sub(p.clone().multiplyScalar(tangent.dot(p))).normalize();
    pts.push(p.clone().multiplyScalar(2.012));
  }
  const curve=new THREE.CatmullRomCurve3(pts);
  const geo=new THREE.TubeGeometry(curve, steps*2, 0.012, 5, false);
  const mat=new THREE.MeshBasicMaterial({color:AGES[0].vein, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false});
  const m=new THREE.Mesh(geo,mat);
  m.userData.op=0;
  return m;
}
for(let i=0;i<MAXVEINS;i++){ const v=makeVein(); veins.push(v); organism.add(v); }

// ============================================================
//  CULTURE — glyphes/points or-ambre projetés sur la surface
// ============================================================
const MAXGLYPHS=520;
let glyphs;
(function(){
  const pos=new Float32Array(MAXGLYPHS*3);
  for(let i=0;i<MAXGLYPHS;i++){ const d=randDir().multiplyScalar(2.03);
    pos[i*3]=d.x;pos[i*3+1]=d.y;pos[i*3+2]=d.z; }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setDrawRange(0,0);
  glyphs=new THREE.Points(g,new THREE.PointsMaterial({color:0xf5c87a,size:0.055,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
  organism.add(glyphs);
})();

// ============================================================
//  POPULATION — particules en orbite basse, blanc bleuté
// ============================================================
const MAXPOP=1100;
let popCloud, popData=[];
(function(){
  const pos=new Float32Array(MAXPOP*3);
  for(let i=0;i<MAXPOP;i++){
    const dir=randDir(); const r=2.14+Math.random()*0.26;
    popData.push({dir, r, ang:Math.random()*6.283, sp:0.15+Math.random()*0.4, axis:randDir()});
    const d=dir.clone().multiplyScalar(r); pos[i*3]=d.x;pos[i*3+1]=d.y;pos[i*3+2]=d.z;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setDrawRange(0,0);
  popCloud=new THREE.Points(g,new THREE.PointsMaterial({color:0xbcd4ff,size:0.035,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
  scene.add(popCloud); // hors du groupe : orbite indépendante
})();

// ============================================================
//  BURST de transition (réutilisé, pas recréé)
// ============================================================
const MAXBURST=320;
let burst, burstData=[], burstActive=false;
(function(){
  const pos=new Float32Array(MAXBURST*3), col=new Float32Array(MAXBURST*3);
  for(let i=0;i<MAXBURST;i++){ burstData.push({v:new THREE.Vector3(),life:0}); pos[i*3+1]=-999; }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setAttribute("color",new THREE.BufferAttribute(col,3));
  burst=new THREE.Points(g,new THREE.PointsMaterial({size:0.09,vertexColors:true,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
  scene.add(burst);
})();
function fireBurst(color){
  burstActive=true; const c=new THREE.Color(color);
  const pos=burst.geometry.attributes.position.array, col=burst.geometry.attributes.color.array;
  for(let i=0;i<MAXBURST;i++){ const d=randDir();
    burstData[i].v=d.clone().multiplyScalar(2+Math.random()*5); burstData[i].life=1;
    const o=d.clone().multiplyScalar(2.05);
    pos[i*3]=o.x;pos[i*3+1]=o.y;pos[i*3+2]=o.z;
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  burst.geometry.attributes.position.needsUpdate=true;
  burst.geometry.attributes.color.needsUpdate=true;
}

// ============================================================
//  CAMÉRA ORBITALE (maison ; zoom limité r=4..10)
// ============================================================
let theta=0.7,phi=1.12,dist=7,distT=7,drag=false,lx=0,ly=0,downX=0,downY=0,auto=true,pinch0=0,pinchD0=0;
function updCam(){ const x=dist*Math.sin(phi)*Math.cos(theta),y=dist*Math.cos(phi),z=dist*Math.sin(phi)*Math.sin(theta);
  camera.position.set(x,y,z); camera.lookAt(0,0,0); }
canvas.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;downX=e.clientX;downY=e.clientY;auto=false;canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;theta-=dx*0.005;phi=Math.max(0.25,Math.min(Math.PI-0.25,phi-dy*0.005));});
canvas.addEventListener("pointerup",e=>{drag=false;if(Math.abs(e.clientX-downX)<6&&Math.abs(e.clientY-downY)<6)eveil(e.clientX,e.clientY);setTimeout(()=>auto=true,4000);});
canvas.addEventListener("wheel",e=>{e.preventDefault();distT=Math.max(4,Math.min(10,distT+e.deltaY*0.006));},{passive:false});
canvas.addEventListener("touchstart",e=>{if(e.touches.length===2){pinchD0=td(e);pinch0=distT;}});
canvas.addEventListener("touchmove",e=>{if(e.touches.length===2){e.preventDefault();distT=Math.max(4,Math.min(10,pinch0*(pinchD0/Math.max(1,td(e)))));}},{passive:false});
function td(e){const a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}

// ============================================================
//  ÉVEIL — clic sur la sphère
// ============================================================
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function eveil(px,py){
  ndc.x=(px/innerWidth)*2-1; ndc.y=-(py/innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObject(sphere,false);
  if(!hit.length) return;
  // combo
  const now=performance.now();
  gameState.combo = (now-gameState.lastClick<2000) ? Math.min(20,gameState.combo+1) : 1;
  gameState.lastClick=now;
  const mult=gameState.combo;
  const gain=2.7*mult;
  gameState.res.know+=gain; gameState.totalKnow+=gain;
  // onde depuis le point cliqué (en espace LOCAL → suit la rotation)
  const local=organism.worldToLocal(hit[0].point.clone()).normalize();
  uni.uClickPos.value.copy(local);
  uni.uClickAge.value=0; uni.uClickStr.value=mult;
  // HUD combo
  const cEl=document.getElementById("combo");
  if(mult>1){ cEl.textContent="×"+mult; cEl.classList.add("on"); }
  document.getElementById("hint").style.opacity="0";
}

// ============================================================
//  CONSTRUCTION (HUD bas centre)
// ============================================================
const buildEl=document.getElementById("build");
BUILDINGS.forEach(b=>{
  const d=document.createElement("div"); d.className="bcard"; d.dataset.b=b.id;
  d.innerHTML=`<div class="bn">${b.icon} ${b.name} <b data-q>0</b></div>
    <div class="be">+${b.rate}/s 🧠</div><div class="bc" data-c>🧠 ${b.baseCost}</div>`;
  d.addEventListener("click",()=>buy(b.id));
  buildEl.appendChild(d);
});
function buy(id){
  const b=BUILDINGS.find(x=>x.id===id); const cost=costOf(b);
  if(gameState.res.know<cost) return;
  gameState.res.know-=cost; gameState.buildings[id]++;
  uni.uClickStr.value=Math.max(uni.uClickStr.value,4); uni.uClickAge.value=Math.min(uni.uClickAge.value,0.1);
}

// ============================================================
//  TRANSITION D'ÂGE
// ============================================================
function checkAge(){
  const next=AGES[gameState.age+1];
  if(next && gameState.totalKnow>=next.req){ transition(gameState.age+1); }
}
function transition(toAge){
  gameState.age=toAge; const A=AGES[toAge];
  // palette
  animateColor(uni.uBase.value, A.base); animateColor(uni.uB2.value, A.b2); animateColor(uni.uRim.value, A.rim);
  for(const v of veins) animateColor(v.material.color, A.vein);
  // flash + burst + message
  const f=document.getElementById("flash");
  f.style.transition="none"; f.style.opacity="0.85"; void f.offsetWidth;
  f.style.transition="opacity 1.1s ease"; f.style.opacity="0";
  fireBurst(A.rim);
  showMessage(A.msg[0], A.msg[1]);
}
function animateColor(target, hex){
  const from=target.clone(), to=new THREE.Color(hex), t0=performance.now();
  (function step(){ const k=Math.min(1,(performance.now()-t0)/1400);
    target.copy(from).lerp(to,k); if(k<1) requestAnimationFrame(step); })();
}
let msgTimer=null;
function showMessage(big,small){
  const m=document.getElementById("msg");
  document.getElementById("msgBig").textContent=big;
  document.getElementById("msgSmall").textContent=small;
  m.classList.add("show"); clearTimeout(msgTimer);
  msgTimer=setTimeout(()=>m.classList.remove("show"),3000);
}

// ============================================================
//  MAPPING valeurs → intensité visuelle (0..1, courbe douce)
// ============================================================
function vis(v,scale){ return 1-Math.exp(-v/scale); }
function fmt(n){ if(n<1000) return (n<10?n.toFixed(1):Math.floor(n)).toString();
  const u=["K","M","Md","T","Qa"]; let i=-1; while(n>=1000&&i<u.length-1){n/=1000;i++;} return n.toFixed(1)+u[i]; }

// ============================================================
//  BOUCLE
// ============================================================
let last=performance.now();
const disp={know:0,energy:0,culture:0,pop:0};
let veinShown=0, glyphShown=0, popShown=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,(now-last)/1000); last=now;

  // --- production temps réel ---
  gameState.res.know+=knowRate()*dt; gameState.totalKnow+=knowRate()*dt;
  gameState.res.energy+=gameState.base.energy*dt;
  gameState.res.culture+=gameState.base.culture*dt + (gameState.buildings.ecole*0.02)*dt;
  gameState.res.pop+=gameState.base.pop*dt + (totalBuildings()*0.015)*dt;
  checkAge();

  // --- intensités visuelles ---
  const bv=Math.min(1, totalBuildings()/24);
  const kVis=Math.min(1, vis(gameState.totalKnow,400)*0.65 + bv*0.45);
  const cVis=Math.min(1, vis(gameState.res.culture,40)*0.7 + bv*0.25);
  const eVis=vis(gameState.res.energy,80);
  const pVis=Math.min(1, vis(gameState.res.pop,25)*0.7 + bv*0.3);

  // uniforms
  uni.uTime.value=now*0.001;
  uni.uEnergy.value+=(eVis-uni.uEnergy.value)*0.05;
  uni.uClickAge.value+=dt;
  uni.uClickStr.value*=0.94;

  // --- CONNAISSANCE : veines révélées ---
  const targetVeins=Math.round(kVis*MAXVEINS);
  for(let i=0;i<MAXVEINS;i++){
    const want=i<targetVeins?1:0;
    const v=veins[i]; v.userData.op+=((want?0.9:0)-v.userData.op)*0.06;
    v.material.opacity=v.userData.op;
    v.visible=v.userData.op>0.01;
  }
  // --- CULTURE : glyphes ---
  glyphShown+=(Math.round(cVis*MAXGLYPHS)-glyphShown)*0.08;
  glyphs.geometry.setDrawRange(0,Math.floor(glyphShown));
  glyphs.material.opacity=0.5+0.5*Math.abs(Math.sin(now*0.0008));
  // --- POPULATION : particules orbitales ---
  popShown+=(Math.round(pVis*MAXPOP)-popShown)*0.08;
  popCloud.geometry.setDrawRange(0,Math.floor(popShown));
  // orbite
  const parr=popCloud.geometry.attributes.position.array;
  const visN=Math.floor(popShown);
  for(let i=0;i<visN;i++){ const d=popData[i]; d.ang+=d.sp*dt;
    const v=d.dir.clone().applyAxisAngle(d.axis,d.ang).multiplyScalar(d.r);
    parr[i*3]=v.x;parr[i*3+1]=v.y;parr[i*3+2]=v.z; }
  if(visN>0) popCloud.geometry.attributes.position.needsUpdate=true;

  // --- ÉNERGIE : pulsation d'échelle de l'organisme ---
  const pulse=1+Math.sin(now*0.0018)*0.012*uni.uEnergy.value + uni.uClickStr.value*0.004;
  sphere.scale.setScalar(pulse);

  // rotation lente continue
  organism.rotation.y+=0.001;
  if(auto) theta+=0.0005;
  dist+=(distT-dist)*0.1; updCam();

  // --- burst de transition ---
  if(burstActive){
    const pos=burst.geometry.attributes.position.array; let alive=0;
    for(let i=0;i<MAXBURST;i++){ const b=burstData[i]; if(b.life>0){ alive++;
      b.life-=dt*0.8; pos[i*3]+=b.v.x*dt; pos[i*3+1]+=b.v.y*dt; pos[i*3+2]+=b.v.z*dt; b.v.multiplyScalar(0.96);
      if(b.life<=0) pos[i*3+1]=-999; } }
    burst.material.opacity=0.9;
    burst.geometry.attributes.position.needsUpdate=true;
    if(alive===0) burstActive=false;
  }

  // --- combo timeout ---
  if(performance.now()-gameState.lastClick>2000 && gameState.combo>0){
    gameState.combo=0; document.getElementById("combo").classList.remove("on");
  }

  // --- HUD ---
  for(const k of ["know","energy","culture","pop"]){
    disp[k]+=(gameState.res[k]-disp[k])*0.2;
    document.getElementById("s-"+k).textContent=fmt(disp[k]);
    document.getElementById("r-"+k).textContent="+"+rateOf(k).toFixed(rateOf(k)<1?2:1)+"/s";
  }
  // build cards
  for(const b of BUILDINGS){ const card=buildEl.querySelector(`[data-b="${b.id}"]`);
    const cost=costOf(b), ok=gameState.res.know>=cost;
    card.querySelector("[data-q]").textContent=gameState.buildings[b.id];
    const c=card.querySelector("[data-c]"); c.textContent="🧠 "+fmt(cost); c.className="bc "+(ok?"ok":"ko");
    card.classList.toggle("no",!ok);
  }
  // age box
  const A=AGES[gameState.age], next=AGES[gameState.age+1];
  document.getElementById("ageName").textContent=A.name;
  document.getElementById("ageTag").textContent=A.tag;
  if(next){
    const prev=A.req, span=next.req-prev, p=Math.max(0,Math.min(1,(gameState.totalKnow-prev)/span));
    document.querySelector("#ageBar>i").style.width=(p*100)+"%";
    document.getElementById("ageNext").textContent=fmt(gameState.totalKnow)+" / "+fmt(next.req)+" 🧠 — vers "+next.name;
  } else {
    document.querySelector("#ageBar>i").style.width="100%";
    document.getElementById("ageNext").textContent="Apogée atteinte";
  }

  renderer.render(scene,camera);
}
updCam(); requestAnimationFrame(loop);
showMessage(AGES[0].msg[0],AGES[0].msg[1]);

addEventListener("resize",()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight,false); });
})();
</script>
</body>
</html>
